    <!-- DM Sans (UI/body) + DM Serif Display (display) — the two families the
         whole design system requests. Outfit was previously loaded here but
         nothing styles with it: theme.js, tokens.js and every inline fontFamily
         ask for DM Sans, so body text was silently falling back to a system
         sans. A single sans keeps every surface consistent. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html {
        /* The navbar is fixed; keep in-page anchor targets clear of it. */
        scroll-padding-top: 6rem;
      }
      body {
        font-family: 'DM Sans', system-ui, sans-serif;
        background: #eef6f0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f0f7f2; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(#0a4f22, #174a72); border-radius: 3px; }
    </style>
  </head>
